<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#070b13" />
    <meta
      name="description"
      content="Merkado De 'Colon — build your own stall in a living, lantern-lit Colon Street night market. A 3D Filipino marketplace tycoon."
    />
    <title>Merkado De 'Colon — Night Market Tycoon</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23080d18'/%3E%3Cpath d='M32 14 8 28h48L32 14Z' fill='%23e8a33c'/%3E%3Crect x='14' y='30' width='36' height='20' rx='3' fill='%23c94b42'/%3E%3Cpath d='M20 30v20M32 30v20M44 30v20' stroke='%23080d18' stroke-width='3'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Lilita+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link rel="stylesheet" href="/src/styles/cartoon.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" aria-label="Merkado De 'Colon 3D night market"></canvas>
      <div id="cinematic-vignette" aria-hidden="true"></div>
      <div id="weather-overlay" aria-hidden="true"></div>
      <div id="flash-overlay" aria-hidden="true"></div>

      <section id="boot-screen" class="screen">
        <div class="boot-inner">
          <div class="boot-umbrellas" aria-hidden="true">
            <i class="u u1"></i><i class="u u2"></i><i class="u u3"></i><i class="u u4"></i><i class="u u5"></i>
          </div>
          <div class="boot-kicker">COLON STREET · CEBU CITY</div>
          <h1 class="boot-title">Merkado<br /><span>De 'Colon</span></h1>
          <div class="boot-status" id="boot-status">Lighting the umbrellas…</div>
          <div class="boot-track"><span id="boot-progress"></span></div>
          <div class="boot-tip" id="boot-tip">Tip: regulars love a well-kept stall.</div>
        </div>
      </section>

      <section id="login-screen" class="screen hidden"></section>

      <div id="hud" class="hidden"></div>
      <div id="toast-root" aria-live="polite"></div>
      <div id="float-text-root" aria-hidden="true"></div>
      <div id="overlay-root"></div>

      <div id="connection-lost" class="hidden" role="alert">
        <div class="conn-card">
          <div class="conn-spinner"></div>
          <div>
            <strong>Lost the market signal</strong>
            <p>Reconnecting to Colon Street… your stall is saved.</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
